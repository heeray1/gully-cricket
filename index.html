<style>
  :root { --surface: rgba(28, 17, 11, .9); --line: rgba(255, 236, 210, .10); --text: #fff7ec; --muted: #b9a693;
    --chip: rgba(255, 236, 210, .08); --primary: #fff4e0; --ink: #24130a; --gold1: #ffdf8a; --gold2: #f2a64a; --bg: #1a0e08; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2f7a2a; touch-action: none; overscroll-behavior: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ib { position: fixed; top: max(12px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18);
    background: rgba(20,10,5,.55); color: #fff; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; display: none; align-items: center;
    justify-content: center; padding: 0; z-index: 3; transition: transform .1s; }
  .ib:active { transform: scale(.94); }
  #bpause { left: max(12px, env(safe-area-inset-left)); } #bsnd { right: max(12px, env(safe-area-inset-right)); }
  #ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; overflow: auto;
    background: rgba(12, 6, 3, .5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #ov.on { display: flex; }
  #ov.homebg { background: rgba(12, 6, 3, .3); }
  .card { width: min(360px, 100%); margin: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 30px;
    padding: 24px 20px 18px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    animation: cardIn .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.5px; line-height: 1.1; }
  .card p { margin: 8px 0 0; font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--muted); }
  .card p b { color: var(--text); }
  .brand { font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
  .brand b { background: linear-gradient(90deg, var(--gold1), var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label, .lab { margin: 0 0 6px; font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lab { margin: 16px 0 7px; }
  .big { font-size: 72px; font-weight: 900; line-height: 1; margin-top: 10px; color: #fff; text-shadow: 0 0 34px rgba(242,166,74,.35); }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .chip { padding: 6px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-weight: 800; font-size: 12.5px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 44px; font: inherit; font-weight: 800; font-size: 14.5px; padding: 0 4px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(255, 236, 210, .05); color: #f3e6d6; cursor: pointer; transition: transform .1s; }
  .seg button:active { transform: scale(.96); }
  .seg button.on { background: var(--primary); border-color: transparent; color: var(--ink); box-shadow: 0 6px 18px rgba(255,214,150,.16); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 18px; min-height: 54px; padding: 0 18px; border: 0;
    border-radius: 999px; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; color: var(--text); background: var(--chip); transition: transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); color: var(--ink); box-shadow: 0 10px 28px rgba(255, 214, 150, .18); }
  .btn.ghost { min-height: 46px; margin-top: 10px; font-size: 16px; background: transparent; border: 1px solid rgba(255, 236, 210, .18); color: #f3e6d6; }
  .actions { display: flex; gap: 10px; } .actions .btn { flex: 1; }
  .sc { display: flex; justify-content: space-between; align-items: baseline; font-weight: 900; font-size: 17px; padding: 11px 14px; margin-top: 8px;
    border-radius: 16px; background: rgba(255, 236, 210, .06); }
  .sc span:last-child { font-size: 20px; } .sc small { color: var(--muted); font-size: 13px; font-weight: 700; }
  .sc.win span:last-child { color: var(--gold1); }
  .small { font-size: 13px !important; }
  .gem { width: 70px; height: 70px; margin: 0 auto 14px; border-radius: 50%; position: relative;
    background: conic-gradient(from 200deg, var(--gold1), var(--gold2), #ff8a8a, #d2a8ff, #8fe3c3, var(--gold1));
    box-shadow: 0 0 70px rgba(255, 190, 90, .7); animation: gemSpin 9s linear infinite, gemPulse 1.6s ease-in-out infinite; }
  .gem::after { content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 35%, rgba(255,255,255,0) 60%); }
  @keyframes gemSpin { to { transform: rotate(360deg); } }
  @keyframes gemPulse { 50% { filter: brightness(1.25); } }
  .chip b { color: var(--text); }
  .chipb { border: 1px solid rgba(255,236,210,.2); font: inherit; font-weight: 800; font-size: 12.5px; cursor: pointer; color: #f3e6d6; }
  .seg button.lock { opacity: .45; }
  .btn:disabled { opacity: .55; }
  .up { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 12px 14px; margin-top: 10px; border-radius: 16px;
    background: rgba(255,236,210,.06); font-weight: 800; font-size: 16px; }
  .up small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 700; margin-top: 2px; } .up .pips { color: var(--gold1); letter-spacing: 2px; font-size: 12px; }
  .up button { min-width: 84px; min-height: 42px; border-radius: 999px; border: 0; font: inherit; font-weight: 900; font-size: 15px; background: var(--primary); color: var(--ink); cursor: pointer; }
  .up button:disabled { opacity: .4; }

<body>
<canvas id="c"></canvas>
<button class="ib" id="bpause" aria-label="Pause">&#10074;&#10074;</button>
<button class="ib" id="bsnd" aria-label="Sound">&#9834;</button>
<div id="ov" class="on"><div class="card" id="card"></div></div>
<script>
"use strict";
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const Q=new URLSearchParams(location.search), BOT=Q.has("bot"), $=id=>document.getElementById(id);
const LW=400, LH=700;
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const LS={ get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

// ---------- grounds, profile, settings ----------
const GROUNDS=[ { n:"Gully",   fee:0,   prize:100,  tro:10, win:1.3,  spd:1.12, vary:.25, aiq:.14,  rpb:[2.0,2.6], dfd:[1.9,2.3], sweep:.8,   tint:null },
                { n:"Maidan",  fee:100, prize:300,  tro:20, win:1.1,  spd:1.04, vary:.4,  aiq:.05,  rpb:[2.4,3.0], dfd:[1.7,2.1], sweep:.95,  tint:"rgba(255,140,40,.12)" },
                { n:"Club",    fee:300, prize:800,  tro:35, win:.92,  spd:.96,  vary:.55, aiq:-.05, rpb:[2.8,3.4], dfd:[1.5,1.8], sweep:1.12, tint:"rgba(120,50,130,.2)" },
                { n:"Stadium", fee:800, prize:2000, tro:60, win:.76,  spd:.9,   vary:.72, aiq:-.14, rpb:[3.0,3.8], dfd:[1.3,1.6], sweep:1.3,  tint:"rgba(6,12,52,.42)" } ];
const MODES={ both:"Bat & Bowl", bat:"Bat only", bowl:"Bowl only" };
const BT=[ { n:"Fast", q:.08, sp:1.35, dur:800 }, { n:"Swing", q:.04, sp:1.1, dur:920 }, { n:"Spin", q:0, sp:.85, dur:1150 } ];   // your deliveries: faster meter = bigger reward
let cfg={ mode:"both", overs:2 };
try{ Object.assign(cfg, JSON.parse(LS.get("gc_cfg","{}"))); }catch(e){}
let P={ coins:200, tro:0, streak:0, bat:0, arm:0, g:0, played:0, won:0 };
try{ Object.assign(P, JSON.parse(LS.get("gc_p","{}"))); }catch(e){}
if(Q.has("mode")) cfg.mode=Q.get("mode"); if(Q.has("overs")) cfg.overs=+Q.get("overs"); if(Q.has("diff")) P.g=+Q.get("diff");
if(!MODES[cfg.mode]) cfg.mode="both"; cfg.overs=clamp(cfg.overs|0,1,5); P.g=clamp(P.g|0,0,3);
const save=()=>{ if(!BOT){ LS.set("gc_p",JSON.stringify(P)); LS.set("gc_cfg",JSON.stringify(cfg)); } };
const D=()=>GROUNDS[P.g], WIN=()=>D().win*(1+.05*P.bat), fmt=n=>Math.round(n).toLocaleString("en-IN");
const YOU={ shirt:"#2f7dd1", cap:"#17508f", name:"You" }, CPU={ shirt:"#e2463b", cap:"#8f1f18", name:"Rivals" };

// ---------- match state ----------
let M=null, I=null;                 // match, current innings
let phase="menu";                   // menu | card | runup | flight | play | aim | meter
let gt=0, tNext=0, paused=false;    // game clock (ms), stops while paused or a card is open
let ball=null, nb=null, pend=null, shot=null, tm=null, drag=null, swingAt=-1e9, pop=null, stumpsHit=-1e9, runAnim=null, newOver=false, lastTiming="", shake=0;
let aim={ off:8, tb:.62, type:0, acc:1, t0:0, p:0, v:0, vt:-1e9, last:"" };
let cam={ x:200, y:350, z:1 };
// the field: 9 directions in front of the batsman, each one open (0), guarded close in (1) or guarded in the deep (2)
const SEC=9, SW=.28, secOf=th=>clamp(Math.round(th/SW)+4,0,SEC-1);
let field=Array(SEC).fill(0);
let fielders=[0,1,2,3,4,5].map(()=>({ hx:200, hy:300, x:200, y:300, tx:null, ty:null }));
function setField(userBats,snap){
  field=Array(SEC).fill(0);
  if(userBats) [0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5).slice(0,6).forEach(i=>{ field[i]=Math.random()<.5?1:2; });
  else [0,2,3,5,6,8].forEach((i,j)=>{ field[i]=j%2?2:1; });
  let j=0; field.forEach((v,i)=>{ if(!v) return; const s=Math.sin((i-4)*SW), a=Math.abs(s), f=fielders[j++];
    f.hx=200+s*(v===1?185:400); f.hy=v===1?lerp(318,430,a):lerp(228,300,a); f.tx=null; if(snap){ f.x=f.hx; f.y=f.hy; } });
}

function beginMatch(){
  const fee=BOT?0:D().fee; if(P.coins<fee) return home();
  P.coins-=fee; save(); M={ inn:0, s1:null, bonus:0, fee };
  if(cfg.mode==="bat") return introInnings(true, genTarget(D().rpb));
  if(cfg.mode==="bowl") return introInnings(false, genTarget(D().dfd));
  if(BOT) return introInnings(Math.random()<.5, null);
  if(Math.random()<.5) card({ title:"You won the toss", label:D().n+" · "+cfg.overs+" over"+(cfg.overs>1?"s":""), html:"<p>What do you want to do first?</p>", buttons:[["Bat first",()=>introInnings(true,null)],["Bowl first",()=>introInnings(false,null),"alt"]] });
  else { const cpuBats=Math.random()<.5; card({ title:"Rivals won the toss", label:D().n+" · "+cfg.overs+" over"+(cfg.overs>1?"s":""), html:"<p>They chose to <b>"+(cpuBats?"bat":"bowl")+"</b> first.</p>", buttons:[["OK",()=>introInnings(!cpuBats,null)]], auto:3 }); }
}
function genTarget(r){ return Math.round(cfg.overs*6*rnd(r[0],r[1]))+1; }
function introInnings(user,target){
  const maxW=cfg.overs+1, max=cfg.overs*6; M.inn++;
  I={ user, runs:0, wk:0, balls:0, max, maxW, target, over:[] }; ball=nb=pend=shot=tm=null; pop=null; runAnim=null; newOver=false; aim.last=""; setField(user,true);
  const ov=cfg.overs+" over"+(cfg.overs>1?"s":"")+", "+maxW+" wickets";
  const howBat="<p><b>Swipe</b> the way you want to hit, just as the ball reaches you. Green marks are open gaps. Perfect timing is a SIX.</p>";
  const howBowl="<p><b>Drag</b> the ring to aim, pick a ball and press <b>BOWL</b>. Then stop the meter in the green.</p>";
  const html = user ? (target ? "<div class='big'>"+target+"</div><p>runs to win in "+max+" balls.</p>"+howBat : "<p>Set a big target. "+ov+".</p>"+howBat)
                    : (target ? "<div class='big'>"+(target-1)+"</div><p>to defend. Rivals need "+target+" in "+max+" balls.</p>"+howBowl : "<p>Keep them to a low score. "+ov+".</p>"+howBowl);
  card({ title:user?"You bat":"You bowl", label:(M.inn===1&&cfg.mode==="both"?"1st innings":target?"The chase":"Innings")+" · "+ov, html, buttons:[["Start",()=>{ queueBall(); }]], auto:P.played?4:0 });
  if(BOT) setTimeout(()=>{ closeCard(); queueBall(); },300);
}
function makeBall(){
  const d=D(), r=Math.random(), type = r<1-d.vary ? "normal" : r<1-d.vary*.6 ? "fast" : r<1-d.vary*.2 ? "slow" : "spin", l=Math.random(), q=Math.random();
  return { type, dur:{ normal:1180, fast:940, slow:1480, spin:1280 }[type]*d.spd*rnd(.95,1.05), endX:l<.35?201:l<.7?226:182, onStumps:l<.35,
    tb:q<.1?.5:q<.65?.62:q<.9?.74:.88, spin:type==="spin"?(Math.random()<.5?-1:1):0, swung:false, botErr:(Math.random()+Math.random()+Math.random()-1.5)*2*(+Q.get("bot")||50) };
}
function queueBall(){
  ball=null; pend=null; shot=null; drag=null;
  if(newOver){ I.over=[]; newOver=false; if(I.user) setField(true,false); }
  for(const f of fielders){ f.tx=null; }
  if(I.user){ nb=makeBall(); phase="runup"; tNext=gt+900+Math.random()*350; } else phase="aim";
}
const tri=u=>{ u=((u%1)+1)%1; return u<.5 ? u*4-1 : 3-u*4; };                    // triangle wave -1..1
const persp=t=>Math.pow(t,1.55), sAt=y=>clamp(lerp(.24,1,(y-200)/440),.2,1.15);
// where a ball with this line (off) and bounce point (tb) lands on the pitch: [x, y, scale]
const ringAt=(off,tb)=>{ const p=persp(tb); return [lerp(200,201+off,p), lerp(246,598,p), lerp(.26,1,p)]; };
function moveRing(dx,dy){
  const [x,y]=ringAt(aim.off,aim.tb), ny=clamp(y+dy,246+352*persp(.45),246+352*persp(.95)), p=(ny-246)/352;
  aim.tb=Math.pow(p,1/1.55); aim.off=clamp((x+dx-200)/p-1,-80,80);
}
const meterV=()=>tri((gt-aim.t0)/(1100/(D().sweep*BT[aim.type].sp*(1-.07*P.arm)*(1+.05*Math.floor(I.balls/6))))+aim.p);
function startMeter(){ if(phase!=="aim") return; phase="meter"; drag=null; aim.t0=gt; aim.p=Math.random(); snd("tick"); }
function stopMeter(){
  const v=meterV(), e=Math.abs(v); aim.v=v; aim.vt=gt;
  if(v>.8){ snd("groan"); return settle("NB","NO BALL","Overstepped, +1 run",1000); }
  aim.acc = e<=.18?1 : e<=.45?.65 : .3;
  aim.off+=rnd(-1,1)*(1-aim.acc)*40; aim.tb=clamp(aim.tb+rnd(-1,1)*(1-aim.acc)*.13,.45,.95);
  phase="runup"; tNext=gt+650; snd(aim.acc===1?"perfect":"tick");
}
const lineVal=a=>a<=14?1 : a<=40?.7 : a<=62?.35 : 0, lenVal=tb=>tb>=.86?1 : tb>=.7?.3 : tb>=.56?.7 : .4;
const lenName=tb=>tb>=.86?"Yorker!" : tb>=.7?"Half volley" : tb>=.56?"Good length" : "Short ball";
function release(){
  if(I.user){ ball=nb; nb=null; ball.t0=gt; }
  else {
    const a=Math.abs(aim.off), wide=a>62, tb=aim.tb, key=aim.type+"|"+Math.round(aim.off/25)+"|"+lenName(tb), rep=key===aim.last; aim.last=key;
    const q=(lineVal(a)+lenVal(tb))/2*(.5+.4*aim.acc)+BT[aim.type].q+(rep?-.14:.04);
    ball={ type:"normal", dur:BT[aim.type].dur*rnd(.97,1.03), t0:gt, endX:201+aim.off, onStumps:a<=14, tb, spin:aim.type===2?(Math.random()<.5?-.6:.6):0, swung:false, wide,
      ai:wide?null:aiOutcome(q,a<=14,rep?"He read it!":lenName(tb)) };
  }
  phase="flight"; snd("release");
}
// what the computer batsman does with your ball: better balls mean fewer runs and more wickets
function aiOutcome(q,onStumps,name){
  q=clamp(q+D().aiq,0,1);
  let pw=.02+.1*q*q, tier = q>=.95?0 : q>=.72?1 : q>=.4?2 : 3;
  if(I.target){ const need=I.target-I.runs, left=I.max-I.balls; if(left>0&&need/left>2.2){ tier=Math.min(3,tier+1); pw+=.05; } }
  const say = q>=.95?"Great ball" : q>=.4?name : "Poor ball";
  if(Math.random()<pw) return { r:"W", kind:onStumps&&Math.random()<.6?"bowled":"caught", say };
  const w=[[50,30,10,8,2],[30,32,16,16,6],[15,28,17,26,14],[6,18,16,34,26]][tier], runs=[0,1,2,4,6];
  let x=Math.random()*100, i=0; while(i<4&&(x-=w[i])>0) i++;
  return { r:runs[i], say };
}
// ball position in flight: t=0 release, t=ball.tb bounce, t=1 at the bat, t~1.12 at the stumps
function ballPos(t){
  const tb=ball.tb, p=persp(t), s=lerp(.26,1,Math.min(p,1.2));
  const x=lerp(200,ball.endX,Math.min(p,1.25))+ball.spin*Math.sin(Math.min(t,1)*Math.PI)*34*s, gy=lerp(246,598,p);
  const h = t<tb ? 92*(1-(t/tb)*(t/tb)) : lerp(64,16,clamp((tb-.5)/.42,0,1))*Math.sin(Math.PI/2*Math.min(1.4,(t-tb)/(1-tb)));
  return { x, gy, y:gy-h*s, s };
}
function flyNow(){ const f=ball.fly, k=clamp((gt-f.t0)/f.dur,0,1), e=1-(1-k)*(1-k); return { x:lerp(f.x0,f.x1,e), y:lerp(f.y0,f.y1,e)-f.peak*Math.sin(Math.PI*k), s:lerp(f.s0,f.s1,e), k }; }
// batting: the touch sets the timing, the swipe that follows (a few hundredths of a second) sets the direction
function swingDown(x,y){
  if(!ball||ball.swung||pend) return;
  const dt=gt-25-(ball.t0+ball.dur), a=Math.abs(dt)/WIN();
  if(dt<0&&a>520) return;                       // far too early: ignore the touch instead of wasting the swing
  ball.swung=true; swingAt=gt;
  if(a>340){ lastTiming=dt<0?"Too early":"Too late"; tm={ v:dt<0?-1:1, t:gt, label:lastTiming.toUpperCase(), col:"#ff5a4a" }; snd("whoosh"); return; }
  pend={ dt, a, t:gt, x, y, dx:0, dy:0, tb:(gt-ball.t0)/ball.dur };
}
function resolveSwing(){
  const { dt, a }=pend, d=Math.hypot(pend.dx,pend.dy), e=dt<0?"Early":"Late";
  const th = d<12 ? rnd(-.08,.08) : pend.dy>0 ? Math.sign(pend.dx||1)*1.12 : clamp(Math.atan2(pend.dx,-pend.dy),-1.12,1.12);
  const sec=secOf(th), cov=field[sec]; shot={ sec, t:gt };
  let r, sub, kind="";
  if(a<=70){ r=6; sub="Perfect timing"; }
  else if(a<=130){ if(!cov){ r=4; sub="Through the gap"; } else if(cov===2){ r=2; sub="Cut off in the deep"; } else if(Math.random()<.5){ r=4; sub="Past the fielder"; } else { r=1; sub="Straight to the fielder"; } }
  else if(a<=190){ r=cov?1:Math.random()<.3?3:2; sub=e+(cov?", fielded":", into the gap"); }
  else if(a<=260){ r=cov&&Math.random()<.4?0:1; sub=e; }
  else { const x=Math.random(); if(x<.25){ r="W"; kind="caught"; sub=dt<0?"Edged it, too early":"Edged it, too late"; } else if(x<.7){ r=1; sub="Lucky edge"; } else { r=0; sub="Edge, no run"; } }
  tm={ v:clamp(dt/(340*WIN()),-1,1), t:gt, label:a<=70?"PERFECT!":a<=130?"GOOD":a<=260?e.toUpperCase():"EDGE", col:a<=70?"#5ad1ff":a<=130?"#4ade80":a<=260?"#ffd84a":"#ff5a4a" };
  if(a<=70) snd("perfect");
  hit(r,kind,sub,th,a>260); pend=null;
}
// send the ball off the bat and settle the ball
function hit(r,kind,sub,th,edge){
  const p=ballPos(pend?pend.tb:Math.min(1,(gt-ball.t0)/ball.dur)), s=Math.sin(th), a=Math.abs(s);
  let F;
  if(r===6) F=[200+s*520,150,250,1250,.22]; else if(r===4) F=[200+s*500,lerp(212,238,a),22,950,.28];

  if(b&&b[5]<1.02) drawBall(b[0],b[1],b[2],b[3],b[4]);
  batsmen(); stumps();
  if(!I.user&&(phase==="aim"||phase==="meter"||phase==="runup"||(phase==="flight"&&(gt-ball.t0)/ball.dur<ball.tb))){      // your aiming ring
    const a=Math.abs(aim.off), v=(lineVal(a)+lenVal(aim.tb))/2, col=a>62?"#ff5a4a":v>=.8?"#4ade80":v>=.55?"#ffd84a":"#ff9d3c", [x,y,s]=ringAt(aim.off,aim.tb), pu=phase==="aim"?1+.1*Math.sin(gt/130):1;
    ctx.fillStyle="rgba(255,255,255,.2)"; ctx.beginPath(); ctx.ellipse(x,y,24*s*pu,10.5*s*pu,0,0,7); ctx.fill(); ring(x,y,s*pu,col,4*Math.max(.6,s)); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,3.5*s,0,7); ctx.fill(); }
  if(b&&b[5]>=1.02) drawBall(b[0],b[1],b[2],b[3],b[4]);
  fx(now);
}
const F=(w,px)=>w+" "+px+"px ui-rounded,system-ui";
const BTN={ bowl:[292,484,98,58], type:i=>[10,452+i*44,96,38] }, inR=(x,y,r)=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];
// the vertical gauge on the left: shot timing when you bat, the bowling meter when you bowl
function gauge(bands,mark,top,bottom){
  const x=14, y=236, h=200, w=16;
  ctx.fillStyle="rgba(28,17,11,.8)"; ctx.beginPath(); ctx.roundRect(x-5,y-22,w+10,h+44,13); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.clip(); for(const [a,b2,c] of bands){ ctx.fillStyle=c; ctx.fillRect(x,y+h*a,w,h*(b2-a)+.5); } ctx.restore();
  ctx.fillStyle="#fff7ec"; ctx.font=F(800,8); ctx.textAlign="center"; ctx.fillText(top,x+w/2,y-11); ctx.fillText(bottom,x+w/2,y+h+11);
  if(mark!==null){ const my=y+h*(mark+1)/2; ctx.fillStyle="#fff"; ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(x-4,my-4,w+8,8,4); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w+13,my); ctx.lineTo(x+w+5,my-5); ctx.lineTo(x+w+5,my+5); ctx.closePath(); ctx.fill(); }
}
function hud(){
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="rgba(28,17,11,.86)"; ctx.strokeStyle="rgba(255,236,210,.16)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(64,8,272,108,24); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#f2b55a"; ctx.font=F(800,12); ctx.fillText((I.user?"YOU BAT":"YOU BOWL")+"  ·  OVER "+ovs(I.balls)+" / "+cfg.overs,200,25);
  ctx.fillStyle="#fff"; ctx.font=F(800,36); ctx.fillText((I.user?"":"Rivals ")+I.runs+"/"+I.wk,200,55);
  ctx.font=F(700,14);
  if(I.target){ const need=I.target-I.runs, left=I.max-I.balls; ctx.fillText(need<=0 ? "Target reached!" : (I.user?"Need ":"They need ")+need+" from "+left+" ball"+(left===1?"":"s"),200,82); }
  else ctx.fillText("1st innings  ·  "+(I.maxW-I.wk)+" wicket"+(I.maxW-I.wk===1?"":"s")+" left",200,82);
  const o=I.over.slice(-7); o.forEach((r,i)=>{ const x=200+(i-(o.length-1)/2)*24, ex=r==="WD"||r==="NB"; ctx.fillStyle=r==="W"?"#e2463b":ex?"#ff9d3c":r>=4?"#ffd84a":"rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.arc(x,102,9,0,7); ctx.fill(); ctx.fillStyle=r>=4?"#3a2a10":"#fff"; ctx.font=F(800,ex?8:11); ctx.fillText(r===0?"·":r==="WD"?"wd":r==="NB"?"nb":r,x,102.5); });

  if(I.user){
    const live=tm&&gt-tm.t<1500;
    gauge([[0,.12,"#e2463b"],[.12,.31,"#ffd84a"],[.31,.4,"#4ade80"],[.4,.6,"#5ad1ff"],[.6,.69,"#4ade80"],[.69,.88,"#ffd84a"],[.88,1,"#e2463b"]], live?tm.v:null, "EARLY", "LATE");
    if(live){ const k=(gt-tm.t)/1500, sc=k<.1?lerp(.6,1.15,k/.1):1; ctx.globalAlpha=k>.8?(1-k)/.2:1; ctx.save(); ctx.translate(50,336+tm.v*100); ctx.scale(sc,sc); ctx.textAlign="left";
      text(tm.label,0,0,F(800,20),tm.col,5); ctx.restore(); ctx.textAlign="center"; ctx.globalAlpha=1; }
    if(I.balls===0&&I.over.length===0&&(phase==="runup"||phase==="flight")){ text("Swipe to hit as the ball arrives",200,140,F(700,16),"#fff",4); text("Green = open gap",200,162,F(700,14),"#8ef0ae",4); }
  } else {
    const bands=[[0,.1,"#e2463b"],[.1,.275,"#ff9d3c"],[.275,.41,"#ffd84a"],[.41,.59,"#4ade80"],[.59,.725,"#ffd84a"],[.725,1,"#ff9d3c"]];
    if(phase==="meter"){ gauge(bands,-meterV(),"NO BALL","LOOSE"); text("Tap to stop in the GREEN",200,440,F(800,20),"#fff",5); }
    else if(gt-aim.vt<1300) gauge(bands,-aim.v,"NO BALL","LOOSE");
    if(phase==="aim"){
      BT.forEach((t,i)=>{ const r=BTN.type(i), on=aim.type===i; ctx.fillStyle=on?"#fff4e0":"rgba(28,17,11,.82)"; ctx.strokeStyle=on?"rgba(0,0,0,0)":"rgba(255,236,210,.25)"; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.roundRect(r[0],r[1],r[2],r[3],19); ctx.fill(); ctx.stroke(); ctx.fillStyle=on?"#24130a":"#f3e6d6"; ctx.font=F(800,15); ctx.fillText(t.n,r[0]+r[2]/2,r[1]+r[3]/2+.5); });
      const r=BTN.bowl, pu=1+.03*Math.sin(gt/160); ctx.save(); ctx.translate(r[0]+r[2]/2,r[1]+r[3]/2); ctx.scale(pu,pu);
      ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.roundRect(-r[2]/2,-r[3]/2+4,r[2],r[3],29); ctx.fill();
      const g=ctx.createLinearGradient(0,-r[3]/2,0,r[3]/2); g.addColorStop(0,"#ffdf8a"); g.addColorStop(1,"#f2a64a"); ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-r[2]/2,-r[3]/2,r[2],r[3],29); ctx.fill();
      ctx.fillStyle="#24130a"; ctx.font=F(900,21); ctx.fillText("BOWL",0,1); ctx.restore();
      const a=Math.abs(aim.off); text(a>62?"Wide!":lenName(aim.tb).replace("!",""),200,170,F(800,17),a>62?"#ff8a7a":"#fff",4);
      if(I.balls===0&&I.over.length===0){ text("Drag to move the ring",200,140,F(700,16),"#fff",4); text("Aim at the stumps, then press BOWL",200,196,F(700,14),"#ffe9b0",4); }
    }
  }
  if(pop){ const k=(gt-pop.t)/1100; if(k<1){ const sc=k<.12?lerp(.5,1.15,k/.12):k<.2?lerp(1.15,1,(k-.12)/.08):1;
      ctx.globalAlpha=k>.75?1-(k-.75)/.25:1; ctx.save(); ctx.translate(200,345); ctx.scale(sc,sc);
      text(pop.txt,0,0,F(800,54),pop.col,8); text(pop.sub,0,40,F(700,18),"#fff",5); ctx.restore(); ctx.globalAlpha=1; } }
}

// ---------- input ----------
const LXY=e=>[(e.clientX-OX)/S,(e.clientY-OY)/S];
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); if(BOT) return; unlock();
  if(paused||phase==="card"||phase==="menu"||!I) return;
  const [x,y]=LXY(e);
  if(phase==="flight"&&I.user) return swingDown(e.clientX,e.clientY);
  if(phase==="meter") return stopMeter();
  if(phase==="aim"){ for(let i=0;i<3;i++) if(inR(x,y,BTN.type(i))){ aim.type=i; snd("tick"); return; }
    if(inR(x,y,BTN.bowl)) return startMeter();
    drag={ x, y }; } });
cv.addEventListener("pointermove",e=>{ if(pend){ pend.dx=e.clientX-pend.x; pend.dy=e.clientY-pend.y; }
  if(drag&&phase==="aim"){ const [x,y]=LXY(e); moveRing(x-drag.x,y-drag.y); drag={ x, y }; } });
const up=()=>{ drag=null; if(pend&&phase==="flight"&&!paused) resolveSwing(); };
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
addEventListener("keydown",e=>{ if(BOT||paused||!I) return;
  const dir={ ArrowLeft:[-60,-25], ArrowRight:[60,-25], ArrowUp:[0,-60], Space:[0,0] }[e.code]; if(!dir) return; e.preventDefault();
  if(phase==="flight"&&I.user){ swingDown(0,0); if(pend){ pend.dx=dir[0]; pend.dy=dir[1]; resolveSwing(); } }
  else if(phase==="meter") stopMeter(); else if(phase==="aim"){ if(e.code==="Space") startMeter(); else moveRing(dir[0]/6,e.code==="ArrowUp"?-8:0); } });
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("resize",layout); addEventListener("orientationchange",()=>setTimeout(layout,200));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pause(); });
$("bpause").onclick=pause;
function sndIcon(){ $("bsnd").style.opacity=muted?.5:1; $("bsnd").innerHTML=muted?"&#10005;":"&#9834;"; }
$("bsnd").onclick=()=>{ muted=!muted; LS.set("gc_mute",muted?"1":"0"); sndIcon(); if(!muted) snd("tick"); };
window.__state=()=>({ phase, mode:cfg.mode, overs:cfg.overs, ground:P.g, inn:M&&M.inn, user:I&&I.user, runs:I&&I.runs, wk:I&&I.wk, balls:I&&I.balls, target:I&&I.target,
  over:I?I.over.join(","):"", first:M&&M.s1?M.s1.runs+"/"+M.s1.wk:null, done:!!(M&&M.done), title:$("card").querySelector("h1")?.textContent, coins:P.coins, tro:P.tro, field:field.join("") });

layout(); sndIcon(); requestAnimationFrame(frame);
if(BOT){ $("ov").classList.remove("on"); beginMatch(); } else home();
